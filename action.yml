name: 'Aegis PQC Migration Scanner'
description: 'Scans source code for classical crypto and plans PQC migration'
author: 'studio2201'
branding:
  icon: 'lock'
  color: 'purple'

inputs:
  path:
    description: 'Source path to scan for classical crypto algorithms'
    required: false
    default: '.'
  format:
    description: 'Output format (markdown, text, json)'
    required: false
    default: 'markdown'

runs:
  using: 'composite'
  steps:
    - name: Bootstrap aegis (pinned v0.2.13 + SHA-256)
      shell: bash
      run: |
        DEST="${XDG_BIN_HOME:-$HOME/.local/bin}"
        mkdir -p "$DEST"
        if ! command -v aegis >/dev/null 2>&1; then
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) TARGET="x86_64-unknown-linux-musl" ;;
            Darwin-arm64|Darwin-aarch64) TARGET="aarch64-apple-darwin" ;;
            *) echo "::error::Unsupported runner platform $(uname -s)-$(uname -m) (supported: Linux x86_64, macOS arm64)"; exit 1 ;;
          esac
          ASSET="aegis-${TARGET}.tar.gz"
          URL="https://github.com/studio2201/aegis/releases/download/v0.2.13/${ASSET}"
          curl -fsSL --retry 3 "$URL" -o "$TMP/$ASSET"
          curl -fsSL --retry 3 "${URL}.sha256" -o "$TMP/${ASSET}.sha256"
          EXPECTED=$(awk '{print $1}' "$TMP/${ASSET}.sha256")
          [[ "$EXPECTED" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid SHA-256 for $ASSET"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$TMP" && printf '%s  %s\n' "$EXPECTED" "$ASSET" | sha256sum --strict --check -)
          else
            (cd "$TMP" && printf '%s  %s\n' "$EXPECTED" "$ASSET" | shasum -a 256 --check -)
          fi
          tar -xzf "$TMP/$ASSET" -C "$DEST" aegis && chmod 755 "$DEST/aegis"
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Run Aegis Scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        set +e
        aegis scan "$INPUT_PATH" --format "$INPUT_FORMAT" > aegis_summary.md 2>&1
        EC=$?
        set -e

        STATUS="🟢 COMPLIANT"
        BADGE="https://img.shields.io/badge/Aegis-COMPLIANT-brightgreen"
        if [ $EC -ne 0 ]; then
          STATUS="🔴 ACTION REQUIRED"
          BADGE="https://img.shields.io/badge/Aegis-NON--COMPLIANT-red"
        fi

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## 🛡️ Aegis Post-Quantum Cryptography Audit (OMB M-26-15)"
            echo ""
            echo "| Mandate Status | Statutory Deadline | Badge |"
            echo "| :---: | :---: | :---: |"
            echo "| **${STATUS}** | \`2030-12-31\` | ![Aegis](${BADGE}) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat aegis_summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $EC
